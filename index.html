<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Эльдаров Ахмед — Мегафон Чечня</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--dark:#111417;--text:#171a1d;--muted:#7b8488;--line:#e5e9e7;--accent:#35d6b4;--soft:#e5fbf5;--shadow:0 14px 36px rgba(17,20,23,.06);--r:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{width:min(100% - 32px,1440px);margin:0 auto;padding:24px 0 48px}
.hero{background:var(--dark);color:#fff;border-radius:28px;padding:30px 34px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#9da7a4;font-weight:800}
h1{margin:8px 0 5px;font-size:38px;letter-spacing:-.04em}
.subtitle{margin:0;color:#bdc5c2}
.accent-line{width:70px;height:4px;border-radius:10px;background:var(--accent);margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kpi{padding:20px 22px}
.label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.value{font-size:30px;font-weight:900;margin-top:7px;letter-spacing:-.04em}
.section{margin-top:20px}
.section-title{font-size:18px;margin:0 0 12px}
.tools{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.search{width:min(100%,430px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;font:inherit;outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(53,214,180,.12)}
.meta{font-size:13px;color:var(--muted)}
.table-card{overflow:hidden}
.scroll{overflow:auto;max-height:72vh}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:13px 16px;border-bottom:1px solid var(--line);text-align:left}
th{position:sticky;top:0;background:#f9fbfa;z-index:2;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td{font-size:14px}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--soft);font-weight:900}
.phone{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.2px}
.mask{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800}
.badge{display:inline-block;padding:5px 9px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:900}
.footer{color:var(--muted);font-size:12px;text-align:center;padding-top:22px}
@media(max-width:720px){.stats{grid-template-columns:1fr}.shell{width:min(100% - 20px,1440px);padding-top:10px}.hero{padding:24px 20px;border-radius:22px}h1{font-size:31px}}
</style>
</head>
<body>
<main class="shell">
  <section class="hero">
    <div class="eyebrow">Эльдаров Ахмед</div>
    <h1>Мегафон Чечня</h1>
    <p class="subtitle">Номера и маски из файла «1С приемка (3).xlsx»</p>
    <div class="accent-line"></div>
  </section>

  <section class="stats">
    <article class="card kpi"><div class="label">Всего номеров</div><div class="value" id="total">—</div></article>
    <article class="card kpi"><div class="label">Уникальных масок</div><div class="value" id="masksCount">—</div></article>
    <article class="card kpi"><div class="label">Найдено</div><div class="value" id="found">—</div></article>
  </section>

  <section class="section">
    <h2 class="section-title">Номера и маски</h2>
    <div class="tools">
      <input id="search" class="search" type="search" placeholder="Поиск по номеру или маске…" autocomplete="off">
      <div class="meta">Источник: 1С приемка (3).xlsx · используются символы *, a, b, c, d, s</div>
    </div>
    <div class="card table-card">
      <div class="scroll">
        <table>
          <thead><tr><th>#</th><th>Номер телефона</th><th>Маска</th></tr></thead>
          <tbody id="rows"><tr><td colspan="3">Загрузка…</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
  <div class="footer">Агентство Связи · Мегафон Чечня</div>
</main>

<script>
const FILES=['data/megafon_chechnya_1.txt','data/megafon_chechnya_2.txt','data/megafon_chechnya_3.txt','data/megafon_chechnya_4.txt'];
let DATA=[];

const N=n=>Number(n||0).toLocaleString('ru-RU');
function phone(n){return '+7 ('+n.slice(0,3)+') '+n.slice(3,6)+'-'+n.slice(6,8)+'-'+n.slice(8)}

function repeatMask(num){
  const digits=[...num];
  const info={};
  digits.forEach((d,i)=>{
    if(!info[d]) info[d]={count:0,first:i};
    info[d].count++;
  });
  const chosen=Object.entries(info)
    .filter(([,v])=>v.count>=2)
    .sort((a,b)=>b[1].count-a[1].count || a[1].first-b[1].first)
    .slice(0,4);
  const letters=['a','b','c','d'];
  const map={};
  chosen.sort((a,b)=>a[1].first-b[1].first).forEach(([d],i)=>map[d]=letters[i]);
  return digits.map(d=>map[d]||'*').join('');
}

function sequenceMask(num){
  const d=[...num].map(Number);
  const mark=new Array(d.length).fill(false);
  let i=0;
  while(i<d.length-2){
    const step=d[i+1]-d[i];
    if(step!==1 && step!==-1){i++;continue}
    let j=i+1;
    while(j<d.length-1 && d[j+1]-d[j]===step) j++;
    if(j-i+1>=3){
      for(let k=i;k<=j;k++) mark[k]=true;
      i=j+1;
    }else i++;
  }
  return mark.map(x=>x?'s':'*').join('');
}

function strength(mask){return [...mask].filter(x=>x==='*').length}
function maskFor(num){
  const r=repeatMask(num), s=sequenceMask(num);
  if(strength(s)<strength(r)) return s;
  return r;
}

async function load(){
  const parts=await Promise.all(FILES.map(f=>fetch(f).then(r=>{
    if(!r.ok) throw new Error(f);
    return r.text();
  })));
  const nums=parts.flatMap(t=>t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean));
  DATA=nums.map(n=>({number:n,mask:maskFor(n)}));
  document.getElementById('total').textContent=N(DATA.length);
  document.getElementById('masksCount').textContent=N(new Set(DATA.map(x=>x.mask)).size);
  render();
}
function render(){
  const q=document.getElementById('search').value.trim().toLowerCase().replace(/\s+/g,'');
  const digits=q.replace(/\D/g,'');
  const filtered=!q?DATA:DATA.filter(x=>{
    const mask=x.mask.toLowerCase();
    return (digits && x.number.includes(digits)) || mask.includes(q);
  });
  document.getElementById('found').textContent=N(filtered.length);
  document.getElementById('rows').innerHTML=filtered.map((x,i)=>
    '<tr><td><span class="rank">'+(i+1)+'</span></td><td class="phone">'+phone(x.number)+'</td><td><span class="badge mask">'+x.mask+'</span></td></tr>'
  ).join('') || '<tr><td colspan="3">Ничего не найдено</td></tr>';
}
document.getElementById('search').addEventListener('input',render);
load().catch(()=>{document.getElementById('rows').innerHTML='<tr><td colspan="3">Ошибка загрузки списка номеров</td></tr>'});
</script>
</body>
</html>
